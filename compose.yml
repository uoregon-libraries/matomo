version: "2.4"

services:
  db:
    image: mariadb:10
    environment:
      - MYSQL_DATABASE=matomo
      - MYSQL_USER=matomo
      - MYSQL_PASSWORD=matomo
      - MYSQL_RANDOM_ROOT_PASSWORD=1
    volumes:
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
      - db:/var/lib/mysql
  web:
    build: .
    volumes:
      - data:/var/www/html
    depends_on:
      - db

volumes:
  db:
  data:
